<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfb"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ce6b4"/>
      <stop offset="1" stop-color="#20c77a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb0b5"/>
      <stop offset="1" stop-color="#ff5563"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Fundo contínuo, sem stroke/borda externa -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="112" height="512" rx="112" fill="#eef3f5" opacity=".6"/>

  <!-- Marcadores laterais -->
  <g fill="#dbe3e6">
    <rect x="38" y="116" width="88" height="36" rx="18"/>
    <rect x="38" y="238" width="88" height="36" rx="18"/>
    <rect x="38" y="360" width="88" height="36" rx="18"/>
  </g>

  <!-- halos locais, sem reflexo curvo global -->
  <path d="M224 100 158 179h34v212c0 20 16 36 36 36s36-16 36-36V179h34L232 100a5 5 0 0 0-8 0Z" fill="#35c982" opacity=".18" filter="url(#soft)"/>
  <path d="M340 412 274 333h34V121c0-20 16-36 36-36s36 16 36 36v212h34l-66 79a5 5 0 0 1-8 0Z" fill="#ff6572" opacity=".18" filter="url(#soft)"/>

