  <path d="M331 424 260 339c-6-7-1-18 8-18h31V120c0-23 18-41 41-41s41 18 41 41v201h31c9 0 14 11 8 18l-71 85a12 12 0 0 1-18 0Z" fill="url(#red)"/>
